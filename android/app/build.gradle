plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.cadeli.waters"

    // ✅ REQUIRED for Google Play 2025
    compileSdk = 35

    defaultConfig {
        applicationId "com.cadeli.waters"

        // REQUIRED by Firebase and Google Maps
        minSdk = 23

        // REQUIRED by Google Play
        targetSdk = 35

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        manifestPlaceholders = [
                MAPS_API_KEY   : localProperties.getProperty("MAPS_API_KEY", ""),
                applicationName: "io.flutter.app.FlutterApplication"
        ]

    }

    // ⭐ REQUIRED for notifications, stripe, firebase, kotlin 2.x, AGP 8.x
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        // 🔥 THIS FIXES YOUR CURRENT ERROR
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

// ⭐ REQUIRED for flutter_local_notifications to compile
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter {
    source = "../.."
}
